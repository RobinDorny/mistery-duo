<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Mistery Duo — Beheer</title>

    <link
        rel="stylesheet"
        href="admin.css">

    <script
        type="module"
        src="admin.js">
    </script>

</head>


<body>


<header class="admin-header">

    <div class="admin-brand">

        <div class="admin-logo">
            MD
        </div>

        <div>
            <span>MISTERY DUO</span>
            <h1>Beheerplatform</h1>
        </div>

    </div>


    <button
        id="logoutBtn"
        class="logout-button">

        Uitloggen

    </button>

</header>


<main class="admin-main">


<!-- INSTELLINGEN -->

<section class="panel">

    <div class="panel-title">

        <div>
            <span>WEBSITE</span>
            <h2>Algemene instellingen</h2>
        </div>

    </div>


    <form id="settingsForm">


        <label>

            Titel

            <input
                id="heroTitle"
                type="text"
                placeholder="Mistery Duo">

        </label>


        <label>

            Welkomsttekst

            <textarea
                id="heroText"
                rows="4"></textarea>

        </label>


        <label>

            Over ons

            <textarea
                id="aboutText"
                rows="7"></textarea>

        </label>


        <label>

            Footer tekst

            <input
                id="footerText"
                type="text">

        </label>


        <label>

            Logo URL

            <input
                id="logoUrl"
                type="url"
                placeholder="Cloudinary URL">

        </label>


        <button
            type="submit"
            class="gold-button">

            Instellingen opslaan

        </button>


        <p
            id="settingsStatus"
            class="status">
        </p>


    </form>

</section>


<!-- CLOUDINARY -->

<section class="panel">

    <div class="panel-title">

        <div>
            <span>CLOUDINARY</span>
            <h2>Media uploaden</h2>
        </div>

    </div>


    <div class="upload-grid">


        <!-- FOTO -->

        <div class="upload-card">

            <h3>📷 Foto uploaden</h3>

            <input
                id="photoInput"
                type="file"
                accept="image/*">


            <input
                id="photoTitle"
                type="text"
                placeholder="Titel">


            <input
                id="photoDescription"
                type="text"
                placeholder="Beschrijving">


            <button
                id="uploadPhotoBtn"
                class="gold-button">

                Foto uploaden

            </button>


            <p
                id="photoStatus"
                class="status">
            </p>

        </div>


        <!-- VIDEO -->

        <div class="upload-card">

            <h3>🎬 Video uploaden</h3>

            <input
                id="videoInput"
                type="file"
                accept="video/*">


            <input
                id="videoTitle"
                type="text"
                placeholder="Titel">


            <input
                id="videoDescription"
                type="text"
                placeholder="Beschrijving">


            <button
                id="uploadVideoBtn"
                class="gold-button">

                Video uploaden

            </button>


            <p
                id="videoStatus"
                class="status">
            </p>

        </div>


        <!-- LOGO -->

        <div class="upload-card">

            <h3>⭐ Logo wijzigen</h3>

            <input
                id="logoInput"
                type="file"
                accept="image/*">


            <button
                id="uploadLogoBtn"
                class="gold-button">

                Nieuw logo uploaden

            </button>


            <p
                id="logoStatus"
                class="status">
            </p>

        </div>


    </div>

</section>


<!-- LIVESTREAM -->

<section class="panel">

    <div class="panel-title">

        <div>
            <span>LIVE</span>
            <h2>Livestream</h2>
        </div>

    </div>


    <form id="streamForm">


        <label class="checkbox-row">

            <input
                id="livestreamActive"
                type="checkbox">

            <span>
                Livestream actief
            </span>

        </label>


        <label>

            Livestream URL

            <input
                id="livestreamUrl"
                type="url"
                placeholder="https://...">

        </label>


        <button
            type="submit"
            class="gold-button">

            Livestream opslaan

        </button>


        <p
            id="streamStatus"
            class="status">
        </p>


    </form>

</section>


<!-- AGENDA -->

<section class="panel">

    <div class="panel-title">

        <div>
            <span>AGENDA</span>
            <h2>Optreden toevoegen</h2>
        </div>

    </div>


    <form id="agendaForm">


        <label>

            Datum

            <input
                id="agendaDate"
                type="date"
                required>

        </label>


        <label>

            Titel

            <input
                id="agendaTitle"
                type="text"
                placeholder="Optreden"
                required>

        </label>


        <label>

            Locatie

            <input
                id="agendaLocation"
                type="text"
                required>

        </label>


        <label>

            Beschrijving

            <textarea
                id="agendaDescription"
                rows="4"></textarea>

        </label>


        <button
            type="submit"
            class="gold-button">

            Optreden toevoegen

        </button>


        <p
            id="agendaStatus"
            class="status">
        </p>


    </form>


    <div
        id="adminAgendaList"
        class="admin-list">

    </div>

</section>


<!-- AANVRAGEN -->

<section class="panel">

    <div class="panel-title">

        <div>
            <span>AANVRAGEN</span>
            <h2>Boekingsaanvragen</h2>
        </div>


        <button
            id="refreshRequestsBtn"
            class="small-button">

            Vernieuwen

        </button>

    </div>


    <div
        id="requestsList"
        class="requests-list">

        Aanvragen laden...

    </div>

</section>


<!-- MEDIA -->

<section class="panel">

    <div class="panel-title">

        <div>
            <span>MEDIA</span>
            <h2>Website media</h2>
        </div>


        <button
            id="refreshMediaBtn"
            class="small-button">

            Vernieuwen

        </button>

    </div>


    <div
        id="adminMediaList"
        class="admin-media-list">

        Media laden...

    </div>

</section>


</main>

</body>
</html>
