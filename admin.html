<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mistery Duo - Beheer</title>

    <link rel="stylesheet" href="admin.css">

</head>


<body>

<header class="admin-header">

    <div>
        <span>M</span>istery Duo
    </div>

    <p>Beheerplatform</p>

    <a href="index.html">
        Website bekijken
    </a>

</header>


<main class="admin-container">


    <!-- NIEUWS -->

    <section class="admin-card">

        <h2>Nieuws toevoegen</h2>

        <form id="newsForm">

            <input
                id="newsTitle"
                type="text"
                placeholder="Titel"
                required
            >

            <textarea
                id="newsText"
                placeholder="Nieuwsbericht"
                required
            ></textarea>

            <button type="submit">
                Nieuws publiceren
            </button>

        </form>

    </section>


    <!-- AGENDA -->

    <section class="admin-card">

        <h2>Optreden toevoegen</h2>

        <form id="eventForm">

            <input
                id="eventTitle"
                type="text"
                placeholder="Naam optreden"
                required
            >

            <input
                id="eventDate"
                type="date"
                required
            >

            <input
                id="eventLocation"
                type="text"
                placeholder="Locatie"
                required
            >

            <button type="submit">
                Optreden toevoegen
            </button>

        </form>

    </section>


    <!-- MEDIA -->

    <section class="admin-card">

        <h2>Foto of video uploaden</h2>

        <p class="info">
            Foto's en video's worden opgeslagen via Cloudinary.
        </p>


        <form id="mediaForm">

            <input
                id="mediaTitle"
                type="text"
                placeholder="Titel"
            >


            <select id="mediaType">

                <option value="image">
                    Foto
                </option>

                <option value="video">
                    Video
                </option>

            </select>


            <input
                id="mediaFile"
                type="file"
                accept="image/*,video/*"
                required
            >


            <button type="submit">
                Uploaden
            </button>

        </form>


        <div id="uploadProgress"></div>

    </section>


    <div
        id="message"
        class="message"
    ></div>


</main>


<script
    type="module"
    src="admin.js"
></script>

</body>

</html>
